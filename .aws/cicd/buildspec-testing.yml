version: 0.2

# ==============================================================================
# VARIABLES DE ENTORNO
# Los placeholders __...__ los reemplaza buildspec.yml por sed antes de que este
# archivo llegue a la etapa de testing.
# ==============================================================================
env:
  shell: bash
  variables:
    AWS_DEFAULT_REGION: "us-east-2"
    ACCOUNT_ID: "__ACCOUNT_ID__"
    ECR_REPOSITORY: "__ECR_REPOSITORY__"
    HASH_TAG_BY_ENVIRONMENT: "__HASH_TAG_BY_DEPLOY_ENV__"
    # El contenedor escucha siempre en 8000 (ver Dockerfile CMD)
    APP_PORT: "8000"
    TESTING_BASE_URL: "http://localhost:8000"

# ==============================================================================
# FASES
# ==============================================================================
phases:
  install:
    commands:
      # ------------------------------------------------------------------------
      # 1. Docker-in-Docker (DinD)
      # ------------------------------------------------------------------------
      - echo "[INSTALL] Iniciando el demonio de Docker (DinD)..."
      - nohup dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=vfs > /tmp/dockerd.log 2>&1 &
      - |
        timeout 15 sh -c "until docker info; do echo .; sleep 1; done" || (echo "[ERROR] Falló el inicio de Docker" && cat /tmp/dockerd.log && exit 1)

      # ------------------------------------------------------------------------
      # 2. Dependencias de la suite de smoke (pytest + requests)
      # ------------------------------------------------------------------------
      - echo "[INSTALL] Instalando dependencias de la suite de smoke..."
      - pip install --quiet --no-cache-dir "pytest>=8" "requests>=2.32"

  pre_build:
    commands:
      # ------------------------------------------------------------------------
      # 3. Autenticación y descarga de la imagen recién construida
      # ------------------------------------------------------------------------
      - echo "[PRE-BUILD] Configurando acceso a ECR..."
      - ECR_URI="$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI

      - TARGET_IMAGE="$ECR_URI/$ECR_REPOSITORY:$HASH_TAG_BY_ENVIRONMENT"
      - echo "[PRE-BUILD] Descargando la imagen de la aplicación -> $TARGET_IMAGE"
      - docker pull $TARGET_IMAGE

  build:
    commands:
      # ------------------------------------------------------------------------
      # 4. Levantamos el contenedor de la app (no requiere secretos para arrancar)
      # ------------------------------------------------------------------------
      - echo "[BUILD] Levantando contenedor de pruebas..."
      - |
        docker run -d \
          --name app_test \
          -p $APP_PORT:$APP_PORT \
          $TARGET_IMAGE

      # ------------------------------------------------------------------------
      # 5. Healthcheck — esperamos a que /health responda 200
      # ------------------------------------------------------------------------
      - echo "[BUILD] Esperando a que el servicio HTTP esté disponible en el puerto $APP_PORT..."
      - |
        timeout 30 bash -c 'until curl -sSf http://localhost:'"$APP_PORT"'/health > /dev/null; do sleep 0.5; done' || (echo "[ERROR] La aplicación no respondió a tiempo." && docker logs app_test && exit 1)

      # ------------------------------------------------------------------------
      # 6. Smoke suite (pytest + requests contra el contenedor)
      # ------------------------------------------------------------------------
      - echo "[BUILD] ¡Conexión establecida! Iniciando smoke suite (pytest + requests)..."
      - pytest .aws/tests/test_smoke.py --junitxml=report.xml

  post_build:
    commands:
      # ------------------------------------------------------------------------
      # 7. Limpieza y logs
      # ------------------------------------------------------------------------
      - echo "[POST-BUILD] Ejecutando tareas de limpieza..."
      - echo "--- LOGS DEL CONTENEDOR (app_test) ---"
      - docker logs app_test || true
      - docker stop app_test || true

# ==============================================================================
# REPORTES Y ARTEFACTOS
# ==============================================================================
reports:
  pytest-reports:
    files:
      - "report.xml"
    file-format: "JUNITXML"

artifacts:
  files:
    - "report.xml"
  name: debug-artifacts
