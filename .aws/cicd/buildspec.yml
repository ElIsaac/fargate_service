version: 0.2

env:
  shell: bash
  variables:
    AWS_DEFAULT_REGION: "us-east-2"
    ECR_REPOSITORY: "fargate_service"
    BASE_DEPLOY_PATH: "/home/ubuntu/apps"
    SECRETS_MANAGER_PROJECT_NAME: "fargate_service"

phases:
  pre_build:
    commands:
      # ============================================================
      # Variables esperadas desde CodePipeline / CodeBuild
      # ------------------------------------------------------------
      # BRANCH_NAME
      # FULL_GITHUB_REPO_NAME
      # COMMIT_HASH
      # COMMIT_MSG
      # PIPELINE_EXECUTION_ID
      # DEPLOY_FOLDER
      # DEPLOY_ENV
      # ECR_REPOSITORY
      # BASE_DEPLOY_PATH
      # SECRETS_MANAGER_PROJECT_NAME
      # AWS_DEFAULT_REGION
      # ============================================================
      - echo "[PRE-BUILD] Verificando variables de entorno requeridas..."
      - |
        required_vars=(
          BRANCH_NAME
          FULL_GITHUB_REPO_NAME
          COMMIT_HASH
          PIPELINE_EXECUTION_ID
          DEPLOY_FOLDER
          DEPLOY_ENV
          ECR_REPOSITORY
          BASE_DEPLOY_PATH
          SECRETS_MANAGER_PROJECT_NAME
          AWS_DEFAULT_REGION
        )

        for var in "${required_vars[@]}"; do
          if [[ -z "${!var}" ]]; then
            echo "[ERROR] La variable $var no está definida o está vacía" >&2
            exit 1
          fi
        done
      - echo "[PRE-BUILD] Todas las variables requeridas están presentes."

      # ========================================================================
      # Setup AWS + Docker login
      # ========================================================================
      - echo "[PRE-BUILD] Obteniendo Account ID y configurando acceso a ECR..."
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI="$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - |
        aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI

      # ========================================================================
      # Normalización de branch y hashes
      # ========================================================================
      - echo "[PRE-BUILD] Normalizando nombres de rama y hashes..."
      - SHORT_HASH=$(echo "$COMMIT_HASH" | cut -c1-7)
      - BRANCH_TAG=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
      - GITHUB_REPO_NAME=$(basename -s .git "$FULL_GITHUB_REPO_NAME")

      - FINAL_DEPLOY_PATH="${BASE_DEPLOY_PATH}/$DEPLOY_FOLDER"
      - HASH_TAG_BY_ENVIRONMENT="${BRANCH_TAG}-${SHORT_HASH}-v${CODEBUILD_BUILD_NUMBER}"

      # ========================================================================
      # Reemplazos en archivos (appspec, deploy, compose, buildspec-testing)
      # ========================================================================
      - echo "[PRE-BUILD] Inyectando variables en plantillas de despliegue..."

      # appspec.yml
      - sed -i "s|__DEPLOY_PATH__|$FINAL_DEPLOY_PATH|g" .aws/cicd/appspec.yml

      # deploy.sh
      - |
        sed -i "s|__DEPLOY_ENV__|$DEPLOY_ENV|g" .aws/cicd/deploy.sh
        sed -i "s|__DEPLOY_PATH__|$FINAL_DEPLOY_PATH|g" .aws/cicd/deploy.sh
        sed -i "s|__ACCOUNT_ID__|$ACCOUNT_ID|g" .aws/cicd/deploy.sh
        sed -i "s|__ECR_REPOSITORY__|$ECR_REPOSITORY|g" .aws/cicd/deploy.sh
        sed -i "s|__SECRETS_MANAGER_PROJECT_NAME__|$SECRETS_MANAGER_PROJECT_NAME|g" .aws/cicd/deploy.sh
        sed -i "s|__HASH_TAG_BY_DEPLOY_ENV__|$HASH_TAG_BY_ENVIRONMENT|g" .aws/cicd/deploy.sh

      # docker-compose.yml
      - |
        sed -i "s|__ACCOUNT_ID__|$ACCOUNT_ID|g" docker-compose.yml
        sed -i "s|__ECR_REPOSITORY__|$ECR_REPOSITORY|g" docker-compose.yml
        sed -i "s|__HASH_TAG_BY_DEPLOY_ENV__|$HASH_TAG_BY_ENVIRONMENT|g" docker-compose.yml

      # buildspec-testing.yml
      - |
        sed -i "s|__ACCOUNT_ID__|$ACCOUNT_ID|g" .aws/cicd/buildspec-testing.yml
        sed -i "s|__ECR_REPOSITORY__|$ECR_REPOSITORY|g" .aws/cicd/buildspec-testing.yml
        sed -i "s|__HASH_TAG_BY_DEPLOY_ENV__|$HASH_TAG_BY_ENVIRONMENT|g" .aws/cicd/buildspec-testing.yml

      # ========================================================================
      # Tags Docker
      # ========================================================================
      - echo "[PRE-BUILD] Generando tags de Docker..."
      - ECR_TAG_HASH="$ECR_URI/$ECR_REPOSITORY:${HASH_TAG_BY_ENVIRONMENT}"
      - ECR_TAG_BUILD_NUMBER="$ECR_URI/$ECR_REPOSITORY:${BRANCH_TAG}-v${CODEBUILD_BUILD_NUMBER}"
      - ECR_TAG_CACHE="$ECR_URI/$ECR_REPOSITORY:cache-${BRANCH_TAG}"
      - ECR_TAG_LATEST="$ECR_URI/$ECR_REPOSITORY:latest-${BRANCH_TAG}"

      - docker buildx create --use || true

  build:
    commands:
      - echo "[BUILD] Construyendo imagen para la rama $BRANCH_TAG..."
      - |
        docker buildx build \
          --platform linux/amd64 \
          --cache-from "type=registry,ref=$ECR_TAG_CACHE" \
          --cache-to "type=registry,ref=$ECR_TAG_CACHE,mode=max" \
          -t "$ECR_TAG_HASH" \
          -t "$ECR_TAG_BUILD_NUMBER" \
          -t "$ECR_TAG_LATEST" \
          --push .

  post_build:
    commands:
      - echo "[POST-BUILD] Build y push completados."
      - echo "Tags generados..."
      - echo "> $ECR_TAG_HASH"
      - echo "> $ECR_TAG_BUILD_NUMBER"
      - echo "> $ECR_TAG_LATEST"

artifacts:
  files:
    - .aws/cicd/**/*
    - .aws/tests/**/*
    - docker-compose.yml
  name: deployment-artifacts
